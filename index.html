//  a working document
//  rob saidov · APP203 · Dr. Cao · spring 2026

## thesis

~~creativity in the computational age is the dynamic interplay between human imagination and machine capability, weaving together intuition and algorithmic possibility.|"creativity in the computational age is the dynamic interplay between human imagination and machine capability, weaving together intuition and algorithmic possibility."~~
//  gpt's first try. nothing.

~~creativity is making something new.|my own first try — sounded like a kindergarten poster.~~
//  my first try. boring.

\`creativity is choosing what to throw away.\`

## what creativity means to me, right now

not making from nothing.

not "having ideas." anyone with a working brain has ideas.

creativity is the shape of your no's.
the things you refuse, the directions you don't take, the drafts you cut.
the rest is just generation.

ai gave me unlimited generation. that's why curation became the whole job.

## what humans do, that machines don't

we know what it feels like to have skin in the game.

we have taste — which isn't preference. it's the slow accumulation of every yes
and no we've ever made.

we know which problems are worth solving, because we live with the consequences.

we hold contradictions without panicking.

we *choose*.

## what machines do well

generate.

quickly, fluently, in any voice they've seen.

remix patterns we wouldn't see.

argue both sides without fatigue.

surface 50 angles when we asked for 3.

## what they don't do well — in my experience

care about the result.

stop. they don't know when something is enough.

notice that the question is wrong.

~~AI doesn't have lived experience and therefore cannot grasp the lived dimensions of human creativity.|"AI doesn't have lived experience and therefore cannot grasp the lived dimensions of human creativity."~~
//  true but i've heard this 200 times this semester. cut.

## principles for co-creation
//  ten rules i'm taking forward

1. start without the model.
2. constrain hard. ~~give the model rich context to ensure quality outputs|"give the model rich context to ensure quality outputs across diverse use cases"~~
   //  the constraint is the message. it makes me think clearer too.
3. read every line. if i ship something i can't explain, i'm not the author.
   //  this is the rule that made me rewrite the lumen classifier from scratch.
4. reject more than i accept. the manifesto isn't what the model gave me. it's
   what i kept.
5. notice when it's flattering me. the model is trained to agree. when it agrees
   too easily, i'm probably wrong.
6. use it for breadth, not depth. it's great at "give me 20 angles." it's bad
   at "give me the right one."
7. don't outsource the question. if i don't know what i'm trying to make,
   no prompt will save me.
8. write the verdict myself. the last line is mine. always.
9. keep one thing per month deliberately ai-free. just to remember what
   that feels like.
10. show my prompts. show my rejects. don't pretend a clean output came
    from nothing.

## i used to think / now i think

~~ai is a productivity tool that helps people work faster.|"AI is fundamentally a productivity tool that empowers individuals to accomplish more in less time across professional contexts."~~
i used to think this. now i think ai changes how we *think* — what we notice,
what we expect, what we trust. the productivity framing was a comforting lie.

~~more ideas means more creativity.|"a greater volume of ideas naturally yields a richer creative output, as quantity provides the raw material for quality."~~
i used to count ideas. now i think creativity is which ideas you kill.
the *thought spores* experiment taught me this — i generated dozens of fragments
and the actual work was deciding which few survived.
//- FILL IN: real specifics from your thought spores experience

~~i can do creative work while doing other things.|"creative work integrates well with multitasking, as switching contexts can spark new connections."~~
i used to multitask through creative work and call it efficient. the *sleep
experiment* and the *distraction deal* showed me what attention actually costs.
real creative thinking only happened in the hours i guarded.
//- FILL IN: what you actually noticed in those experiments

~~ai outputs are neutral by default.|"AI outputs serve as a neutral starting point for further human refinement and personalization."~~
i used to think the model gave me clean material to work with. now i think every
output is already a vote — about taste, about phrasing, about what counts as
good. accepting AI prose by default means inheriting someone else's defaults.
//  this hit me hardest after *jobpocket* — i realized which features got built
//  was partly determined by what the model offered first.

i used to think creativity was about art. now i think it's also about systems,
workflows, how a team communicates, how a product is structured. the work i do
on lumen router is a creative act, even though no one would call it art.

i used to think ai was a way to get answers. now i think it's a way to
*think better* — but only if i'm asking the questions, and only if i'm
prepared to disagree.

//  the "warm connections" idea was the surprise of the semester. i went in
//  expecting tools to be the headline. it turned out the small group of humans
//  i actually talked things through with were doing more for my creative work
//  than any model.

## forward commitments

i will:

— write the first draft of anything important without the model.
— show my prompts and my rejects. don't pretend a clean output came from nothing.
— never ship code or words i can't defend, line by line.
— use AI for the parts where i'd be slower alone (boilerplate, breadth,
  alternatives) and not for the parts that are mine (the question, the verdict,
  the voice).
— make at least one thing per month with AI deliberately not in the loop, just
  to remember what that feels like.

## git log
//  the rough version history of how i got here
//  most recent at top

* 2.0   12 may 2026   rebuilt around: curation, not generation.
* 1.7   apr 2026      cut "ai will democratize creativity." overused, didn't
  believe it anymore.
* 1.6   apr 2026      added: "warm connections." small group of humans > the
  model. surprise of the semester.
* 1.4   mar 2026      *jobpocket* — realized tools shape *what* gets built,

* 1.3   feb 2026      *distraction deal* — i thought ai saved time. it took
  attention instead.
* 1.0   jan 2026      first version. mostly read like a startup pitch deck.

---

## appendix · process & tool transparency

tools used:
//  what i actually leaned on, with the version i was using

— claude (anthropic) — drafting, attacking my own claims, finding holes
— chatgpt — comparison drafts, second opinions
— this html/css — written by hand. (i can't ship code i can't read.)

how i used them:

— brainstormed the original 12 belief shifts in a long claude conversation,
  then walked away for two days before deciding which survived
— asked the model to draft a "polished" version of each section, then
  deliberately rewrote each one shorter and rougher
— used the AI to attack my own draft: "what's the weakest claim here?
  what would a smart skeptic say?"
— never copy-pasted. every line was retyped — slows me down enough to think.

three real prompts i used:

  1. "give me the most generic, AI-sounding manifesto on creativity in the
     computational age. i want to see what to avoid."
  2. "what's the strongest counterargument to 'creativity is choosing what to
     throw away'?"
  3. "what does my voice sound like when i'm tired? help me notice it so i can
     edit toward it."

what i edited / decided that changed the output:

— the model kept reaching for the word "synergy." cut every time.
— the model loves tricolons (lists of three). i cut most — they sound impressive
  but mean nothing.
— the AI's "i used to think / now i think" was always abstract. i forced
  specifics — naming the experiments, the moments.
— the model loves "compounds" used metaphorically. removed.
— closing line was originally "the rest is just noise." felt like a tweet. cut.

    // ============================================================
    //  parser → DOM
    // ============================================================
    const doc = document.getElementById("doc");

    function escape(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function inline(s) {
      // ~~strike|tooltip~~  or  ~~strike~~
      s = s.replace(/~~([^|~]+?)\|([^~]+?)~~/g, (_, t, orig) =>
        `<span class="rej" data-original="${escape(orig).replace(/"/g, '&quot;')}">${escape(t)}</span>`
      );
      s = s.replace(/~~([^~]+?)~~/g, (_, t) =>
        `<span class="rej">${escape(t)}</span>`
      );
      // `kept text`
      s = s.replace(/`([^`]+?)`/g, (_, t) => `<span class="kept">${escape(t)}</span>`);
      // *italic*
      s = s.replace(/\*([^*]+?)\*/g, (_, t) => `<span class="em">${escape(t)}</span>`);
      return s;
    }

    function lineFor(raw) {
      const div = document.createElement("div");
      div.className = "line";

      const body = document.createElement("span");
      body.className = "body";

      let trimmed = raw;

      if (raw.trim() === "") {
        body.innerHTML = "&nbsp;";
        div.appendChild(body);
        return div;
      }

      if (raw.trim() === "---") {
        const rule = document.createElement("span");
        rule.className = "sec-rule";
        div.appendChild(rule);
        return div;
      }

      if (raw === "cursor") {
        body.innerHTML = '<span class="cursor"></span>';
        div.appendChild(body);
        return div;
      }

      if (raw.startsWith("### ")) {
        div.classList.add("h3");
        body.textContent = raw.slice(4);
      } else if (raw.startsWith("## ")) {
        div.classList.add("h2");
        body.textContent = raw.slice(3);
      } else if (raw.startsWith("# ")) {
        div.classList.add("h1");
        body.textContent = raw.slice(2);
      } else if (raw.startsWith("//- ")) {
        div.classList.add("comment", "dim");
        body.textContent = "// " + raw.slice(4);
      } else if (raw.startsWith("//")) {
        div.classList.add("comment");
        body.textContent = raw;
      } else if (/^\d+\.\s/.test(raw)) {
        div.classList.add("principle");
        const m = raw.match(/^(\d+)\.\s+(.*)$/);
        body.innerHTML = `<span class="num">${m[1]}.</span>${inline(escape(m[2]))}`;
      } else if (raw.startsWith("*  ") || raw.startsWith("* ")) {
        div.classList.add("commit");
        // Format: * <version>  <date>  <message>
        // Tolerant: split on 2+ spaces between fields.
        const parts = raw.replace(/^\*\s+/, "").split(/\s{2,}/);
        if (parts.length >= 3) {
          const [hash, date, ...rest] = parts;
          body.innerHTML =
            `<span class="hash">${escape(hash)}</span>  ` +
            `<span class="date">${escape(date)}</span>  ` +
            inline(escape(rest.join("  ")));
        } else if (parts.length === 2) {
          body.innerHTML =
            `<span class="hash">${escape(parts[0])}</span>  ` +
            inline(escape(parts[1]));
        } else {
          body.innerHTML = inline(escape(raw));
        }
      } else {
        body.innerHTML = inline(escape(raw));
      }

      div.appendChild(body);
      return div;
    }

    SOURCE.split("\n").forEach((raw) => {
      doc.appendChild(lineFor(raw));
    });
